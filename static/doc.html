<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Handbook · Northwind Robotics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/app.css" />
  <script src="/static/marked.min.js"></script>
  <script src="/static/purify.min.js"></script>
  <style>
    body { min-height: 100vh; }
    .page {
      max-width: 1040px; margin: 0 auto; padding: 32px 20px 64px;
      display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 28px; align-items: start;
    }
    .toc { position: sticky; top: 20px; font-size: 13.5px; }
    .toc h2 {
      font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em;
      color: var(--faint); margin-bottom: 8px;
    }
    .toc ul { list-style: none; display: flex; flex-direction: column; gap: 2px; }
    .toc a {
      display: block; padding: 6px 10px; border-radius: 8px; color: var(--text-2); text-decoration: none; line-height: 1.35;
    }
    .toc a:hover { background: var(--surface); color: var(--accent); }
    .toc a[aria-current="page"] { background: var(--surface); color: var(--text); font-weight: 600; box-shadow: var(--shadow); }

    .passage-banner {
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
      background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--highlight-edge);
      border-radius: 10px; padding: 10px 14px; margin-bottom: 14px; font-size: 13.5px; color: var(--text-2);
    }
    .passage-banner button {
      margin-left: auto; font: inherit; font-size: 12.5px; background: none; border: 1px solid var(--border-strong);
      color: var(--text-2); border-radius: 8px; padding: 4px 10px; cursor: pointer;
    }
    .passage-banner button:hover { border-color: var(--accent); color: var(--accent); }
    .passage-banner.error { border-left-color: var(--bad); }

    .card {
      background: var(--surface); border-radius: 14px; box-shadow: var(--shadow);
      padding: 40px 48px 48px; font-size: 15px; line-height: 1.75; color: var(--text-2);
    }
    .card.md h1 { font-size: 26px; letter-spacing: -.02em; color: var(--text); margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
    .card.md h2 { font-size: 17px; margin-top: 28px; }
    .card.md h3 { font-size: 15px; }
    .card.md p { margin-bottom: 14px; }
    .card.md strong { color: var(--text); }

    .hl {
      background: var(--highlight); box-shadow: -10px 0 0 var(--highlight), 10px 0 0 var(--highlight);
      border-radius: 2px; transition: background .3s;
    }
    li.hl, tr.hl { box-shadow: none; }
    .hl-start { scroll-margin-top: 90px; }

    @media (max-width: 760px) {
      .page { grid-template-columns: 1fr; padding: 18px 16px 48px; gap: 16px; }
      .toc { position: static; }
      .toc ul { flex-direction: row; flex-wrap: wrap; gap: 6px; }
      .toc a { background: var(--surface); border: 1px solid var(--border); padding: 5px 10px; font-size: 12.5px; }
      .card { padding: 24px 20px 28px; }
      .card.md h1 { font-size: 22px; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
      </span>
      <span class="brand-text">
        <span class="brand-title">Northwind Robotics</span>
        <span class="brand-sub">HR Handbook</span>
      </span>
    </a>
    <nav class="site-nav" aria-label="Main">
      <a href="/">Assistant</a>
      <a href="/evals">Evals</a>
    </nav>
  </header>

  <div class="page">
    <nav class="toc" aria-label="Handbook documents">
      <h2>Handbook</h2>
      <ul id="toc"></ul>
    </nav>
    <main>
      <div id="banner-slot"></div>
      <article class="card md" id="content"></article>
    </main>
  </div>

  <script type="application/json" id="doc-data">__DOC_JSON__</script>
  <script>
    const data = JSON.parse(document.getElementById('doc-data').textContent);
    const content = document.getElementById('content');
    content.innerHTML = DOMPurify.sanitize(marked.parse(data.markdown));
    const title = content.querySelector('h1');
    if (title) document.title = `${title.textContent} · Northwind Robotics`;

    const toc = document.getElementById('toc');
    data.documents.forEach(d => {
      const li = document.createElement('li');
      const a = document.createElement('a');
      a.href = `/docs/${encodeURIComponent(d.filename)}`;
      a.textContent = d.title;
      if (d.filename === data.filename) a.setAttribute('aria-current', 'page');
      li.appendChild(a);
      toc.appendChild(li);
    });

    const BLOCKS = 'h1, h2, h3, h4, p, li, tr, blockquote';
    const norm = s => s.replace(/\s+/g, ' ').trim().toLowerCase();

    function banner(text, { error = false } = {}) {
      const box = document.createElement('div');
      box.className = error ? 'passage-banner error' : 'passage-banner';
      box.setAttribute('role', 'status');
      box.append(text);
      if (!error) {
        const clear = document.createElement('button');
        clear.type = 'button';
        clear.textContent = 'Clear highlight';
        clear.addEventListener('click', () => {
          content.querySelectorAll('.hl').forEach(n => n.classList.remove('hl'));
          box.remove();
          history.replaceState(null, '', location.pathname);
        });
        box.appendChild(clear);
      }
      document.getElementById('banner-slot').replaceChildren(box);
    }

    // Highlight the blocks of this page that belong to the retrieved chunk.
    // Chunks are whole paragraphs joined together, so rendering the chunk's
    // markdown and matching block by block finds exactly that passage.
    async function highlightChunk(chunkIndex) {
      const res = await fetch(`/api/passages/${encodeURIComponent(data.filename)}/${chunkIndex}`);
      const body = await res.json().catch(() => ({}));
      if (!res.ok) {
        banner(`Couldn't load the retrieved passage: ${body.detail || res.status}`, { error: true });
        return;
      }
      const scratch = document.createElement('div');
      scratch.innerHTML = DOMPurify.sanitize(marked.parse(body.text));
      const wanted = new Set([...scratch.querySelectorAll(BLOCKS)].map(n => norm(n.textContent)));

      const matches = [...content.querySelectorAll(BLOCKS)].filter(n => wanted.has(norm(n.textContent)));
      matches.forEach(n => n.classList.add('hl'));
      if (matches.length === 0) {
        banner('The retrieved passage could not be located on this page.', { error: true });
        return;
      }
      banner(`Highlighted: chunk ${chunkIndex}, the passage the assistant retrieved from this document.`);
      matches[0].classList.add('hl-start');
      matches[0].scrollIntoView({ block: 'start', behavior: 'smooth' });
    }

    const chunk = new URLSearchParams(location.search).get('chunk');
    if (chunk !== null && /^\d+$/.test(chunk)) highlightChunk(Number(chunk));
  </script>
</body>
</html>
