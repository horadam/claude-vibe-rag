[project]
name = "claude-vibe-rag"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "openai>=1.50.0",
    "python-dotenv>=1.0.0",
    "tiktoken>=0.8.0",
    "uvicorn>=0.32.0",
]

# Chroma only builds the index (ingest_cli.py); the server searches the JSON
# export. It's an opt-in group so Vercel doesn't install it:
# `uv sync --group ingest`.
[dependency-groups]
ingest = [
    "chromadb>=0.5.0",
]

